<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <!-- REPLACE THIS WITH YOUR PROJECT NAME. EXAMPLE - Category tabs -->
    <title>Category tabs</title>
     <link rel="icon" href="Assets/images/Meubel House_Logos-05.png"/>

</head>

<body>
    <header>
        <div class="logo">
            <img src="Assets/images/Meubel House_Logos-05.png" alt="Marmeto Logo">
            <span>Marmeto</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <div class="icons">
            <a href="#"><img src="Assets/images/akar-icons_search.png" alt="Search Icon" width="20" height="28"></a>
            <a href="#"><img src="Assets/images/akar-icons_heart.png" alt="Heart Icon" width="20" height="28"></a>
            <a href="#"><img src="Assets/images/ant-design_shopping-cart-outlined (1).png" alt="Shopping Cart Icon" width="20" height="28"></a>
        </div>
    </header>

    <section class="cart-banner">
        <div class="content">
            <img src="Assets/images/Rectangle 1.png" alt="Logo">
            <div class="sub-position">
            <img src="Assets/images/Meubel House_Logos-05.png" alt="internallogo" id="internallogo">
            <h1 class="banner-title">Cart</h1>
            <p class="banner-breadcrumb"><a href="#">Home</a> &gt; Cart</p>
        </div>
        </div>
    </section>

<!-- main contant -->


    <div class="cart-container">
        <!-- Cart Table -->
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                    <th></th>
                </tr>
            </thead>      
            <tbody id="cart-items">
                <!-- Dynamic cart items will be inserted here -->
            </tbody>
        </table>

        <!-- Cart Totals -->
        <div class="cart-totals">
            <h2>Cart Totals</h2>
            <div class="totals-row">
                <span>Subtotal</span>
                <span class="gray-text" id="subtotal-price">₹0.00</span>
            </div>
            <div class="totals-row">
                <span>Total</span>
                <span class="gold-text" id="total-price">₹0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Check Out</button>
        </div>
    </div>

    <!-- footer -->
    <footer id="footer">
        <div id="footer-item">
            <img src="Assets/images/trophy 1.png" alt="Trophy Icon">
            <div>
            <h3>High Quality</h3>
            <p>Crafted from top materials</p>
        </div>
        </div>
        <div id="footer-item">
            <img src="Assets/images/Group.png" alt="Warranty Icon">
            <div>
                <h3>Warranty Protection</h3>
            <p>Over 2 years</p>
        </div>
        </div>
        <div id="footer-item">
            <img src="Assets/images/shipping.png" alt="Shipping Icon">
            <div>
            <h3>Free Shipping</h3>
            <p>Order over 150 $</p>
        </div>
        </div>

        <div id="footer-item">
            <img src="Assets/images/customer-support.png" alt="Support Icon">
            <div>
                <h3>24 / 7 Support</h3>
                <p>Dedicated support</p>
        </div>
        </div>
    </footer>


    <script src="./script.js"></script>
</body>

</html>
